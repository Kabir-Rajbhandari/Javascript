    <!-- 
    -> An XMLHttpRequest (XHR) is a built-in browser object used to request and exchange data with a web server asynchronously in the background. This allows a web page to update specific parts of its content dynamically without requiring a full page refresh, providing a seamless experience for the user.
    -> XMLHttpRequest is used heavily in AJAX programming. 
    -> Ajax: Asynchronous JavaScript and XML
     -->

    <!-- 
     The readyState read-only property of the XMLHttpRequest interface returns the state an XMLHttpRequest client is in. An XHR client exists in one of the following states:

        Value	State	Description
        0	UNSENT	Client has been created. open() not called yet.
        1	OPENED	open() has been called.
        2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
        3	LOADING	Downloading; responseText holds partial data.
        4	DONE	The operation is complete. 
        -->
